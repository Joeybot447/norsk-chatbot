version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: norsk_chatbot_postgres
    environment:
      POSTGRES_USER: norsk_chatbot
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: norsk_chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U norsk_chatbot" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: norsk_chatbot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: norsk_chatbot_api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://norsk_chatbot:dev_password_change_in_prod@postgres:5432/norsk_chatbot
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-in-prod-min-32-chars
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/api/src:/app/src
    command: npm run dev

  dashboard:
    build:
      context: ./packages/dashboard
      dockerfile: Dockerfile
    container_name: norsk_chatbot_dashboard
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./packages/dashboard/src:/app/src
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: norsk_chatbot_network
