<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NorskBot — Logg inn">
    <title>NorskBot — Logg inn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%}
        body{font-family:'Inter',system-ui,sans-serif;background:#F9FAFB;color:#1F2937;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}

        .auth-container{width:100%;max-width:400px;padding:0 20px}

        .auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:36px}
        .auth-logo .circle{width:40px;height:40px;background:#3B82F6;border-radius:50%;display:flex;align-items:center;justify-content:center}
        .auth-logo .circle svg{width:20px;height:20px;fill:#fff}
        .auth-logo span{font-size:22px;font-weight:700;color:#1F2937}

        .auth-card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 24px rgba(0,0,0,.04);padding:32px}

        .auth-tabs{display:flex;margin-bottom:24px;border-bottom:2px solid #E5E7EB}
        .auth-tab{flex:1;text-align:center;padding:10px 0;font-size:14px;font-weight:600;color:#9CA3AF;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s}
        .auth-tab.active{color:#3B82F6;border-bottom-color:#3B82F6}

        .auth-form{display:flex;flex-direction:column;gap:16px}
        .auth-field label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px}
        .auth-field input{width:100%;padding:10px 12px;border:1px solid #D1D5DB;border-radius:8px;font-size:14px;background:#F9FAFB;transition:border-color .15s,background .15s}
        .auth-field input:focus{outline:none;border-color:#3B82F6;background:#fff}

        .auth-btn{width:100%;padding:11px;background:#3B82F6;color:#fff;font-size:14px;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:background .15s}
        .auth-btn:hover{background:#2563EB}

        .auth-divider{display:flex;align-items:center;gap:12px;margin:4px 0;color:#9CA3AF;font-size:12px}
        .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:#E5E7EB}

        .auth-social{display:flex;gap:10px}
        .auth-social button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border:1px solid #D1D5DB;border-radius:8px;font-size:13px;font-weight:500;color:#374151;background:#fff;cursor:pointer;transition:background .12s,border-color .12s}
        .auth-social button:hover{background:#F3F4F6;border-color:#9CA3AF}
        .auth-social button svg{width:18px;height:18px}

        .auth-forgot{text-align:right;margin-top:-8px}
        .auth-forgot a{font-size:12.5px;color:#3B82F6}
        .auth-forgot a:hover{text-decoration:underline}

        .auth-footer{text-align:center;margin-top:24px;font-size:12.5px;color:#9CA3AF}
        .auth-footer a{color:#3B82F6}
        .auth-footer a:hover{text-decoration:underline}

        .hidden{display:none!important}
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-logo">
        <div class="circle">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <span>NorskBot</span>
    </div>

    <div class="auth-card">
        <div class="auth-tabs">
            <div class="auth-tab active" data-tab="login">Logg inn</div>
            <div class="auth-tab" data-tab="register">Opprett konto</div>
        </div>

        <!-- LOGIN -->
        <form class="auth-form" id="loginForm">
            <div class="auth-field">
                <label for="loginEmail">E-postadresse</label>
                <input type="email" id="loginEmail" placeholder="din@epost.no" required>
            </div>
            <div class="auth-field">
                <label for="loginPass">Passord</label>
                <input type="password" id="loginPass" placeholder="••••••••" required>
            </div>
            <div class="auth-forgot"><a href="#">Glemt passord?</a></div>
            <button type="submit" class="auth-btn">Logg inn</button>
            <div class="auth-divider">eller</div>
            <div class="auth-social">
                <button type="button">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
                <button type="button">
                    <svg viewBox="0 0 24 24" fill="#1F2937"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                    GitHub
                </button>
            </div>
        </form>

        <!-- REGISTER -->
        <form class="auth-form hidden" id="registerForm">
            <div class="auth-field">
                <label for="regName">Fullt navn</label>
                <input type="text" id="regName" placeholder="Ola Nordmann" required>
            </div>
            <div class="auth-field">
                <label for="regEmail">E-postadresse</label>
                <input type="email" id="regEmail" placeholder="din@epost.no" required>
            </div>
            <div class="auth-field">
                <label for="regPass">Passord</label>
                <input type="password" id="regPass" placeholder="Minst 8 tegn" required>
            </div>
            <button type="submit" class="auth-btn">Opprett konto</button>
            <div class="auth-divider">eller</div>
            <div class="auth-social">
                <button type="button">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
                <button type="button">
                    <svg viewBox="0 0 24 24" fill="#1F2937"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                    GitHub
                </button>
            </div>
        </form>
    </div>

    <div class="auth-footer">
        &copy; 2026 NorskBot — <a href="#">Personvern</a> · <a href="#">Vilkår</a>
    </div>
</div>

<script>
    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
        tab.addEventListener('click', function(){
            document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
            this.classList.add('active');
            const isLogin = this.dataset.tab === 'login';
            document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
            document.getElementById('registerForm').classList.toggle('hidden', isLogin);
        });
    });

    // Demo login
    document.getElementById('loginForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Login failed');
            localStorage.setItem('norskbot_token', data.token);
            // Get site ID
            try {
                const siteRes = await fetch('/api/demo-info');
                const siteData = await siteRes.json();
                if (siteData.siteId) localStorage.setItem('norskbot_site_id', siteData.siteId);
            } catch(_) {}
            window.location.href = 'index.html';
        } catch(err) {
            alert(err.message);
        }
    });
    document.getElementById('registerForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPass').value;
        const company = document.getElementById('regCompany').value;
        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, companyName: company }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Registration failed');
            localStorage.setItem('norskbot_token', data.token);
            try {
                const siteRes = await fetch('/api/demo-info');
                const siteData = await siteRes.json();
                if (siteData.siteId) localStorage.setItem('norskbot_site_id', siteData.siteId);
            } catch(_) {}
            window.location.href = 'index.html';
        } catch(err) {
            alert(err.message);
        }
    });
</script>
</body>
</html>
