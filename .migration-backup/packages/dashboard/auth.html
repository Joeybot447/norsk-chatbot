<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NorskBot — Logg inn">
    <title>NorskBot — Logg inn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --primary-light: #DBEAFE;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --bg-white: #FFFFFF;
            --bg-gray: #F9FAFB;
            --border: #E5E7EB;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-white); color: var(--text-primary);
            display: flex; align-items: center; justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .auth-wrapper { width: 100%; max-width: 420px; padding: 0 24px; }

        /* Logo */
        .auth-logo {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-bottom: 40px;
        }
        .auth-logo .logo-dot {
            width: 40px; height: 40px; background: var(--primary); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-logo .logo-dot svg { width: 22px; height: 22px; fill: #fff; }
        .auth-logo span { font-size: 1.5rem; font-weight: 700; color: var(--primary); }

        /* Card */
        .auth-card {
            background: var(--bg-white); border-radius: var(--radius-lg);
            border: 1px solid var(--border); box-shadow: var(--shadow-lg);
            padding: 36px;
        }

        /* Tabs */
        .auth-tabs {
            display: flex; margin-bottom: 28px;
            border-bottom: 2px solid var(--border);
        }
        .auth-tab {
            flex: 1; text-align: center; padding: 10px 0;
            font-size: 0.9rem; font-weight: 600; color: var(--text-muted);
            cursor: pointer; border-bottom: 2px solid transparent;
            margin-bottom: -2px; transition: color 0.15s, border-color 0.15s;
        }
        .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* Form */
        .auth-form { display: flex; flex-direction: column; gap: 18px; }
        .auth-field label {
            display: block; font-size: 0.8rem; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 6px;
        }
        .auth-field input {
            width: 100%; padding: 11px 14px; border: 1px solid var(--border);
            border-radius: var(--radius-md); font-size: 0.9rem; font-family: inherit;
            background: var(--bg-gray); transition: border-color 0.15s, background 0.15s;
            outline: none;
        }
        .auth-field input:focus { border-color: var(--primary); background: var(--bg-white); }
        .auth-field input::placeholder { color: var(--text-muted); }

        .auth-btn {
            width: 100%; padding: 12px; background: var(--primary); color: #fff;
            font-size: 0.9rem; font-weight: 600; border: none;
            border-radius: var(--radius-md); cursor: pointer; transition: background 0.15s;
            font-family: inherit;
        }
        .auth-btn:hover { background: var(--primary-hover); }

        .auth-forgot { text-align: right; margin-top: -10px; }
        .auth-forgot a { font-size: 0.8rem; color: var(--primary); text-decoration: none; }
        .auth-forgot a:hover { text-decoration: underline; }

        .auth-divider {
            display: flex; align-items: center; gap: 12px;
            color: var(--text-muted); font-size: 0.75rem;
        }
        .auth-divider::before, .auth-divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        .auth-social { display: flex; gap: 10px; }
        .auth-social button {
            flex: 1; display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 10px; border: 1px solid var(--border);
            border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 500;
            color: var(--text-secondary); background: var(--bg-white); cursor: pointer;
            transition: background 0.12s, border-color 0.12s; font-family: inherit;
        }
        .auth-social button:hover { background: var(--bg-gray); border-color: var(--text-muted); }
        .auth-social button svg { width: 18px; height: 18px; }

        .auth-footer {
            text-align: center; margin-top: 28px;
            font-size: 0.8rem; color: var(--text-muted);
        }
        .auth-footer a { color: var(--primary); text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-logo">
        <div class="logo-dot">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <span>NorskBot</span>
    </div>

    <div class="auth-card">
        <div class="auth-tabs">
            <div class="auth-tab active" data-tab="login">Logg inn</div>
            <div class="auth-tab" data-tab="register">Registrer</div>
        </div>

        <!-- LOGIN -->
        <form class="auth-form" id="loginForm">
            <div class="auth-field">
                <label for="loginEmail">E-postadresse</label>
                <input type="email" id="loginEmail" placeholder="din@epost.no" required>
            </div>
            <div class="auth-field">
                <label for="loginPass">Passord</label>
                <input type="password" id="loginPass" placeholder="••••••••" required>
            </div>
            <div class="auth-forgot"><a href="#">Glemt passord?</a></div>
            <button type="submit" class="auth-btn">Logg inn</button>
            <div class="auth-divider">eller</div>
            <div class="auth-social">
                <button type="button">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
                <button type="button">
                    <svg viewBox="0 0 24 24" fill="#1F2937"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                    GitHub
                </button>
            </div>
        </form>

        <!-- REGISTER -->
        <form class="auth-form hidden" id="registerForm">
            <div class="auth-field">
                <label for="regName">Fullt navn</label>
                <input type="text" id="regName" placeholder="Ola Nordmann" required>
            </div>
            <div class="auth-field">
                <label for="regEmail">E-postadresse</label>
                <input type="email" id="regEmail" placeholder="din@epost.no" required>
            </div>
            <div class="auth-field">
                <label for="regPass">Passord</label>
                <input type="password" id="regPass" placeholder="Minst 8 tegn" required>
            </div>
            <button type="submit" class="auth-btn">Opprett konto</button>
            <div class="auth-divider">eller</div>
            <div class="auth-social">
                <button type="button">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
                <button type="button">
                    <svg viewBox="0 0 24 24" fill="#1F2937"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                    GitHub
                </button>
            </div>
        </form>
    </div>

    <div class="auth-footer">
        &copy; 2026 NorskBot — <a href="#">Personvern</a> · <a href="#">Vilkår</a>
    </div>
</div>

<script>
    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
        tab.addEventListener('click', function(){
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const isLogin = this.dataset.tab === 'login';
            document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
            document.getElementById('registerForm').classList.toggle('hidden', isLogin);
        });
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Login failed');
            localStorage.setItem('norskbot_token', data.token);
            try {
                const siteRes = await fetch('/api/demo-info');
                const siteData = await siteRes.json();
                if (siteData.siteId) localStorage.setItem('norskbot_site_id', siteData.siteId);
            } catch(_) {}
            window.location.href = 'index.html';
        } catch(err) {
            alert(err.message);
        }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPass').value;
        const name = document.getElementById('regName').value;
        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, name }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Registration failed');
            localStorage.setItem('norskbot_token', data.token);
            try {
                const siteRes = await fetch('/api/demo-info');
                const siteData = await siteRes.json();
                if (siteData.siteId) localStorage.setItem('norskbot_site_id', siteData.siteId);
            } catch(_) {}
            window.location.href = 'index.html';
        } catch(err) {
            alert(err.message);
        }
    });
</script>
</body>
</html>
